# Render Blueprint: backend API + managed PostgreSQL. Frontend deploys to Vercel (frontend/vercel.json).
services:
  - type: web
    name: silo-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: SILO_ENVIRONMENT
        value: production
      - key: SILO_DATABASE_URL
        fromDatabase: { name: silo-db, property: connectionString }
      - key: SILO_CORS_ORIGINS
        sync: false   # e.g. https://silo.vercel.app
      - key: SILO_LIVE_DATA_ENABLED
        value: "false"
      - key: SILO_FEC_API_KEY
        sync: false
      - key: SILO_CONGRESS_API_KEY
        sync: false
databases:
  - name: silo-db
    plan: free
